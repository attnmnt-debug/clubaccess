spring.application.name=club-access

# Подключение к Docker PostgreSQL на порту 5434
spring.datasource.url=jdbc:postgresql://localhost:5434/club_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate сам создаст и обновит таблицы по нашим Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Показываем красивые SQL-запросы в консоли IDEA (очень помогает при отладке)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true